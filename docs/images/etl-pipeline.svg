<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="340" viewBox="0 0 1240 340"><rect width="1240" height="340" rx="14" fill="#0d1117"/><text x="620.0" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">Football Standings ETL Pipeline</text><text x="620.0" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#8b949e">Live league table data, from REST API to dashboard</text><rect x="20" y="110" width="180" height="120" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/><rect x="20" y="110" width="180" height="6" rx="3" fill="#8b949e"/><text x="110.0" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3">API-Football</text><text x="110.0" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">v3.football.</text><text x="110.0" y="213" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">api-sports.io</text><line x1="200" y1="170.0" x2="238" y2="170.0" stroke="#58a6ff" stroke-width="2.5"/><polygon points="238,164.0 250,170.0 238,176.0" fill="#58a6ff"/><rect x="250" y="110" width="180" height="120" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><rect x="250" y="110" width="180" height="6" rx="3" fill="#58a6ff"/><text x="340.0" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3">1. Extract</text><text x="340.0" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">requests GET</text><text x="340.0" y="213" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">raw.json</text><line x1="430" y1="170.0" x2="468" y2="170.0" stroke="#58a6ff" stroke-width="2.5"/><polygon points="468,164.0 480,170.0 468,176.0" fill="#58a6ff"/><rect x="480" y="110" width="180" height="120" rx="12" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/><rect x="480" y="110" width="180" height="6" rx="3" fill="#d2a8ff"/><text x="570.0" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3">2. Transform</text><text x="570.0" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">pandas DataFrame</text><text x="570.0" y="213" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">20 teams x 14 cols</text><line x1="660" y1="170.0" x2="698" y2="170.0" stroke="#58a6ff" stroke-width="2.5"/><polygon points="698,164.0 710,170.0 698,176.0" fill="#58a6ff"/><rect x="710" y="110" width="180" height="120" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/><rect x="710" y="110" width="180" height="6" rx="3" fill="#f0883e"/><text x="800.0" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3">3. Load</text><text x="800.0" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">staging + MERGE</text><text x="800.0" y="213" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">upsert, no duplicates</text><line x1="890" y1="170.0" x2="928" y2="170.0" stroke="#58a6ff" stroke-width="2.5"/><polygon points="928,164.0 940,170.0 928,176.0" fill="#58a6ff"/><rect x="940" y="110" width="140" height="120" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/><rect x="940" y="110" width="140" height="6" rx="3" fill="#3fb950"/><text x="1010.0" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3">SQL Server</text><text x="1010.0" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">FootballDB</text><text x="1010.0" y="213" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">league_standings</text><line x1="1080" y1="170.0" x2="1098" y2="170.0" stroke="#58a6ff" stroke-width="2.5"/><polygon points="1098,164.0 1110,170.0 1098,176.0" fill="#58a6ff"/><rect x="1110" y="110" width="110" height="120" rx="12" fill="#161b22" stroke="#f2cc60" stroke-width="2"/><rect x="1110" y="110" width="110" height="6" rx="3" fill="#f2cc60"/><text x="1165.0" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3">Power BI</text><text x="1165.0" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">dashboard</text><text x="620.0" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8b949e">E = Extract  ·  T = Transform  ·  L = Load  ·  then Visualize in Power BI</text><text x="620.0" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6e7681">Rerun daily: the MERGE upsert updates old rows and inserts new ones, so there are never duplicates</text></svg>
